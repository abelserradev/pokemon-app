<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pokemon App">
  <!-- Geometric ball mark using app palette; crisp at 16–32px; adapts to tab chrome -->
  <style>
    .shell { fill: #f7f4ef; }
    .rim { stroke: #014471; }
    .upper { fill: #4fb6be; }
    .band { fill: #014471; }
    .hub { fill: #f5d05f; stroke: #014471; }
    .hub-dot { fill: #014471; }
    @media (prefers-color-scheme: dark) {
      .shell { fill: #1a2430; }
      .rim { stroke: #8ecdd3; }
      .upper { fill: #3a9aa3; }
      .band { fill: #8ecdd3; }
      .hub { fill: #f5d05f; stroke: #8ecdd3; }
      .hub-dot { fill: #1a2430; }
    }
  </style>
  <circle class="shell" cx="16" cy="16" r="14"/>
  <path class="upper" d="M16 2a14 14 0 0 1 14 14H2A14 14 0 0 1 16 2z"/>
  <rect class="band" x="2" y="14" width="28" height="4"/>
  <circle class="rim" cx="16" cy="16" r="14" fill="none" stroke-width="2"/>
  <circle class="hub" cx="16" cy="16" r="5" stroke-width="2"/>
  <circle class="hub-dot" cx="16" cy="16" r="2"/>
</svg>
